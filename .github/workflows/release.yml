name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            target: ''
            bundles: deb,rpm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Generate icons from source
        run: npx tauri icon src-tauri/icons/icon-source.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GClaw ${{ github.ref_name }}'
          releaseBody: '在下方 Assets 中下载对应平台的安装包。'
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} ${{ matrix.bundles != '' && format('--bundles {0}', matrix.bundles) || '' }}
          updaterJsonPreferNsis: true

  # 生成 server delta 文件并更新 latest.json
  generate-delta:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史和所有 tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bsdiff
        run: sudo apt-get install -y bsdiff

      - name: Generate server deltas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NEW_VERSION=$(jq -r '.version' package.json)
          echo "=== Generating deltas for ${TAG} (server ${NEW_VERSION}) ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT

          # 1. 从当前 Release 的全量包中提取 server（而不是重新构建）
          echo "--- Extracting server from current release ---"
          gh release download "$TAG" --repo ggtiger/gclaw \
            --pattern "*.app.tar.gz" --dir "$TMPDIR/current" || true

          APP_TAR=$(ls "$TMPDIR/current"/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$APP_TAR" ]; then
            echo "No .app.tar.gz found in current release, skipping"
            exit 0
          fi

          mkdir -p "$TMPDIR/current-app"
          tar xzf "$APP_TAR" -C "$TMPDIR/current-app"
          SERVER_DIR=$(find "$TMPDIR/current-app" -path "*/Resources/server" -type d | head -1 || true)
          if [ -z "$SERVER_DIR" ]; then
            echo "ERROR: Server directory not found in app bundle"
            exit 1
          fi

          # bsdiff 作用在未压缩的 tar 上（gzip 压缩会放大微小差异导致 delta 过大）
          tar cf "$TMPDIR/server-new.tar" --exclude='.git' --sort=name --mtime='2024-01-01 00:00:00' --owner=0 --group=0 --numeric-owner -C "$SERVER_DIR" .

          # 压缩版本用于下载
          gzip -k "$TMPDIR/server-new.tar"
          NEW_HASH=$(sha256sum "$TMPDIR/server-new.tar" | cut -d' ' -f1)
          NEW_GZ_SIZE=$(stat -c%s "$TMPDIR/server-new.tar.gz")
          echo "New server tar: ${NEW_GZ_SIZE} bytes, sha256=${NEW_HASH}"

          # 2. 始终上传当前版本 server tar
          SERVER_TAR_NAME="server-${NEW_VERSION}.tar.gz"
          cp "$TMPDIR/server-new.tar.gz" "$TMPDIR/${SERVER_TAR_NAME}"
          echo "--- Uploading server tar for future deltas ---"
          gh release upload "$TAG" "$TMPDIR/${SERVER_TAR_NAME}" --repo ggtiger/gclaw --clobber

          # 3. 获取最近 3 个旧版本 tag（不含当前 tag）
          PREV_TAGS=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -3)
          if [ -z "$PREV_TAGS" ]; then
            echo "No previous tags found, skipping delta generation"
            exit 0
          fi
          echo "Previous tags to generate deltas for: $(echo $PREV_TAGS | tr '\n' ' ')"

          # 4. 对每个旧版本循环生成 delta
          DELTAS_JSON="[]"
          for PREV_TAG in $PREV_TAGS; do
            OLD_VERSION=$(echo "$PREV_TAG" | sed 's/^v//')
            echo ""
            echo "--- Processing ${PREV_TAG} (server ${OLD_VERSION}) ---"

            # 为每个旧版本创建独立的工作目录
            OLD_WORKDIR="$TMPDIR/old-${OLD_VERSION}"
            mkdir -p "$OLD_WORKDIR"
            PREV_SERVER_TAR="$OLD_WORKDIR/server-old.tar"

            # 优先从 Release 下载旧版本的 server tar
            gh release download "$PREV_TAG" --repo ggtiger/gclaw \
              --pattern "server-${OLD_VERSION}.tar.gz" --dir "$OLD_WORKDIR" 2>/dev/null || true

            if [ -f "$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz" ]; then
              gunzip -k "$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz"
              mv "$OLD_WORKDIR/server-${OLD_VERSION}.tar" "$PREV_SERVER_TAR"
            else
              # 回退：从旧版本的全量包中提取 server
              echo "No standalone server tar for ${PREV_TAG}, extracting from app bundle..."
              gh release download "$PREV_TAG" --repo ggtiger/gclaw \
                --pattern "*.app.tar.gz" --dir "$OLD_WORKDIR" 2>/dev/null || true

              OLD_APP_TAR=$(ls "$OLD_WORKDIR"/*.app.tar.gz 2>/dev/null | head -1 || true)
              if [ -n "$OLD_APP_TAR" ]; then
                echo "Extracting server from ${OLD_APP_TAR}..."
                mkdir -p "$OLD_WORKDIR/app"
                tar xzf "$OLD_APP_TAR" -C "$OLD_WORKDIR/app"
                OLD_SERVER=$(find "$OLD_WORKDIR/app" -path "*/Resources/server" -type d | head -1 || true)
                if [ -n "$OLD_SERVER" ]; then
                  tar cf "$PREV_SERVER_TAR" --exclude='.git' --sort=name --mtime='2024-01-01 00:00:00' --owner=0 --group=0 --numeric-owner -C "$OLD_SERVER" .
                else
                  echo "Server directory not found in ${PREV_TAG} app bundle, skipping this version"
                  continue
                fi
              else
                echo "No archive found for ${PREV_TAG}, skipping this version"
                continue
              fi
            fi

            # 生成 bsdiff delta（在未压缩 tar 上差分）
            echo "Generating bsdiff delta for ${OLD_VERSION} -> ${NEW_VERSION}..."
            DELTA_NAME="server-delta-${OLD_VERSION}-${NEW_VERSION}.delta"
            DELTA_RAW="$OLD_WORKDIR/${DELTA_NAME}.raw"
            DELTA_PATH="$TMPDIR/${DELTA_NAME}"
            bsdiff "$PREV_SERVER_TAR" "$TMPDIR/server-new.tar" "$DELTA_RAW"
            gzip -c "$DELTA_RAW" > "$DELTA_PATH"
            rm "$DELTA_RAW"

            DELTA_SIZE=$(stat -c%s "$DELTA_PATH")

            # Delta 大小异常检测：超过全量 tar.gz 的 80% 则跳过
            THRESHOLD=$(( NEW_GZ_SIZE * 80 / 100 ))
            if [ "$DELTA_SIZE" -gt "$THRESHOLD" ]; then
              echo "Delta ${DELTA_NAME} (${DELTA_SIZE} bytes) exceeds 80% of full tar (${NEW_GZ_SIZE} bytes), skipping"
              rm -f "$DELTA_PATH"
              continue
            fi

            DELTA_HASH=$(sha256sum "$DELTA_PATH" | cut -d' ' -f1)
            echo "Delta: ${DELTA_NAME} (${DELTA_SIZE} bytes, sha256=${DELTA_HASH})"

            # 上传 delta 到 Release
            echo "Uploading ${DELTA_NAME}..."
            gh release upload "$TAG" "$DELTA_PATH" --repo ggtiger/gclaw --clobber

            # 累积到 DELTAS_JSON 数组
            GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"
            DELTAS_JSON=$(echo "$DELTAS_JSON" | jq \
              --arg from "$OLD_VERSION" \
              --arg url "${GH_BASE}/${DELTA_NAME}" \
              --argjson size "$DELTA_SIZE" \
              --arg hash "sha256:${DELTA_HASH}" \
              --arg targetHash "$NEW_HASH" \
              '. + [{ from: $from, url: $url, size: $size, hash: $hash, targetHash: $targetHash }]')
          done

          # 5. 检查是否有有效的 delta
          DELTA_COUNT=$(echo "$DELTAS_JSON" | jq 'length')
          echo ""
          echo "--- Generated ${DELTA_COUNT} valid delta(s) ---"

          if [ "$DELTA_COUNT" -eq 0 ]; then
            echo "No valid deltas generated, skipping latest.json update"
            exit 0
          fi

          # 6. 更新 latest.json 注入 serverDeltas（多条 delta 记录）
          echo "--- Updating latest.json ---"
          gh release download "$TAG" --pattern "latest.json" --repo ggtiger/gclaw --clobber

          # 为各平台注入相同的 delta 信息（server 代码是平台无关的）
          jq --arg sv "$NEW_VERSION" \
             --argjson deltas "$DELTAS_JSON" \
             '
             .version = $sv |
             .serverVersion = $sv |
             .serverDeltas = {
               "darwin-aarch64": $deltas,
               "darwin-x86_64": $deltas,
               "windows-x86_64": $deltas,
               "linux-x86_64": $deltas
             }
             ' latest.json > latest-updated.json

          mv latest-updated.json latest.json
          gh release upload "$TAG" latest.json --repo ggtiger/gclaw --clobber

          echo "=== Delta generation complete ==="

  release:
    needs: [build, generate-delta]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false

  # 同步 Release 到 Gitee（全部文件）
  sync-gitee:
    needs: [release, generate-delta]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'push'
    steps:
      - name: Sync release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: laohu2022
          GITEE_REPO: gclaw
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi

          TAG="${TAG}"
          echo "=== Syncing release ${TAG} to Gitee ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT
          cd "$TMPDIR"

          # 1. 从 GitHub 下载所有 release assets
          echo "--- Downloading all assets from GitHub ---"
          gh release download "$TAG" --repo ggtiger/gclaw --clobber

          TOTAL_SIZE=$(du -sh . | cut -f1)
          echo "Total: ${TOTAL_SIZE}"
          ls -lh

          # 2. 在 Gitee 创建 Release
          echo "--- Creating Gitee release ---"
          RELEASE_ID=$(curl -s --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release..."
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=GClaw ${TAG}" \
              -F "body=在下方 Assets 中下载对应平台的安装包。" \
              -F "target_commitish=main")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP ${HTTP_CODE}: ${BODY}" | head -c 500
            RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            echo "Release ID: ${RELEASE_ID}"
          else
            echo "Gitee release already exists: ${RELEASE_ID}"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create Gitee release"
            exit 1
          fi

          # Gitee 上传函数（带重试）
          upload_to_gitee() {
            local file=$1 max_time=$2 retries=3 delay=10
            local SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            echo "  Uploading: ${file} ($(( SIZE / 1024 )) KB)"
            for i in $(seq 1 $retries); do
              RESP=$(curl -s --max-time "$max_time" --connect-timeout 30 --retry 2 --retry-delay 5 \
                -w "\n%{http_code}" -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" 2>&1)
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | sed '$d')
              FNAME=$(echo "$BODY" | jq -r '(.file_name // .name) // empty' 2>/dev/null || true)
              if [ -n "$FNAME" ]; then
                echo "    OK: ${FNAME}"
                return 0
              fi
              echo "    Attempt ${i}/${retries} failed (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
              [ $i -lt $retries ] && sleep $delay
            done
            echo "    FAIL: ${file}"
            return 1
          }

          # 3. 上传文件到 Gitee（分两步：先小文件，再大文件）
          echo "--- Step 1: Uploading critical small files ---"
          SUCCESS=0
          FAIL=0

          # 3a. 优先上传 delta（小文件，更新必需）
          for file in server-delta-*.delta; do
            [ -f "$file" ] || continue
            if upload_to_gitee "$file" 300; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done

          # 3b. 上传 latest.json（URL 重写为 Gitee）
          if [ -f "latest.json" ]; then
            echo "--- Rewriting latest.json for Gitee ---"
            GITEE_BASE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
            GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

            jq --arg gb "$GH_BASE" --arg gitee "$GITEE_BASE" '
              walk(
                if type == "object" and has("url") then
                  .url = (.url | sub($gb; $gitee))
                else .
                end
              )
            ' latest.json > latest-gitee.json

            if upload_to_gitee "latest-gitee.json" 60; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          fi

          echo "Step 1 done: ${SUCCESS} OK, ${FAIL} FAIL"

          # 3c. 上传剩余大文件（安装包）
          echo "--- Step 2: Uploading large installers ---"
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              server-delta-*.delta|latest.json|latest-gitee.json) continue ;;
            esac
            if upload_to_gitee "$file" 3600; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Total: ${SUCCESS} OK, ${FAIL} FAIL"

          echo "=== Gitee sync complete ==="
