name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            target: ''
            bundles: deb,rpm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Generate icons from source
        run: npx tauri icon src-tauri/icons/icon-source.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GClaw ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} ${{ matrix.bundles != '' && format('--bundles {0}', matrix.bundles) || '' }}
          updaterJsonPreferNsis: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false

  # 同步 Release 到 Gitee（安装包 + latest.json）
  sync-gitee:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Sync release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: laohu2022
          GITEE_REPO: gclaw
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi

          TAG="${TAG}"
          echo "=== Syncing release ${TAG} to Gitee ==="

          # 创建临时目录
          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT

          # 1. 从 GitHub 下载所有 release assets
          echo "--- Downloading assets from GitHub ---"
          cd "$TMPDIR"
          gh release download "$TAG" --repo ggtiger/gclaw --clobber

          # 2. 在 Gitee 创建 Release
          echo "--- Creating Gitee release ---"
          # 检查 release 是否已存在
          RELEASE_ID=$(curl -sf \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}" \
            -d "access_token=${GITEE_TOKEN}" | jq -r '.id // empty' || true)

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -sf -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${TAG}" \
              -d "name=GClaw ${TAG}" \
              -d "body=See the assets to download this version and install." \
              -d "target=main" | jq -r '.id')
            echo "Created Gitee release: ${RELEASE_ID}"
          else
            echo "Gitee release already exists: ${RELEASE_ID}"
          fi

          # 3. 上传所有 assets 到 Gitee
          echo "--- Uploading assets to Gitee ---"
          for file in *; do
            [ -f "$file" ] || continue
            echo "  Uploading: ${file}"
            curl -sf -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${file}" | jq -r '.file_name // .message // "ok"'
          done

          # 4. 重写 latest.json 中的下载 URL（GitHub → Gitee）
          if [ -f "latest.json" ]; then
            echo "--- Rewriting latest.json for Gitee ---"
            GITEE_BASE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
            GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

            # 用 jq 重写所有 url 字段
            jq --arg gb "$GH_BASE" --arg gitee "$GITEE_BASE" '
              walk(
                if type == "object" and has("url") then
                  .url = (.url | sub($gb; $gitee))
                else .
                end
              )
            ' latest.json > latest-gitee.json

            echo "Gitee latest.json:"
            cat latest-gitee.json

            # 上传 Gitee 版本的 latest.json
            curl -sf -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@latest-gitee.json;filename=latest.json" | jq -r '.file_name // .message // "ok"'
          fi

          echo "=== Gitee sync complete ==="
