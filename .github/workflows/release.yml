name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            target: ''
            bundles: deb,rpm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Generate icons from source
        run: npx tauri icon src-tauri/icons/icon-source.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GClaw ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} ${{ matrix.bundles != '' && format('--bundles {0}', matrix.bundles) || '' }}
          updaterJsonPreferNsis: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false

  # 同步 Release 到 Gitee（全部文件）
  sync-gitee:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Sync release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: laohu2022
          GITEE_REPO: gclaw
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi

          TAG="${TAG}"
          echo "=== Syncing release ${TAG} to Gitee ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT
          cd "$TMPDIR"

          # 1. 从 GitHub 下载所有 release assets
          echo "--- Downloading all assets from GitHub ---"
          gh release download "$TAG" --repo ggtiger/gclaw --clobber

          TOTAL_SIZE=$(du -sh . | cut -f1)
          echo "Total: ${TOTAL_SIZE}"
          ls -lh

          # 2. 在 Gitee 创建 Release
          echo "--- Creating Gitee release ---"
          RELEASE_ID=$(curl -s --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release..."
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=GClaw ${TAG}" \
              -F "body=See the assets to download this version and install." \
              -F "target_commitish=main")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP ${HTTP_CODE}: ${BODY}" | head -c 500
            RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            echo "Release ID: ${RELEASE_ID}"
          else
            echo "Gitee release already exists: ${RELEASE_ID}"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create Gitee release"
            exit 1
          fi

          # 3. 上传所有文件到 Gitee（latest.json 最后单独处理）
          echo "--- Uploading to Gitee ---"
          SUCCESS=0
          FAIL=0
          for file in *; do
            [ -f "$file" ] || continue
            [ "$file" = "latest.json" ] && continue  # last.json 最后处理
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            echo "  Uploading: ${file} ($(( SIZE / 1024 )) KB)"
            RESP=$(curl -s --max-time 600 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${file}")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            FNAME=$(echo "$BODY" | jq -r '.file_name // empty' 2>/dev/null || true)
            if [ -n "$FNAME" ]; then
              echo "    OK: ${FNAME}"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "    FAIL (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Uploaded: ${SUCCESS} OK, ${FAIL} FAIL"

          # 4. 重写 latest.json URL（GitHub → Gitee）
          if [ -f "latest.json" ]; then
            echo "--- Rewriting latest.json for Gitee ---"
            GITEE_BASE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
            GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

            jq --arg gb "$GH_BASE" --arg gitee "$GITEE_BASE" '
              walk(
                if type == "object" and has("url") then
                  .url = (.url | sub($gb; $gitee))
                else .
                end
              )
            ' latest.json > latest-gitee.json

            echo "  Uploading: latest.json (rewritten)"
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@latest-gitee.json;filename=latest.json")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            FNAME=$(echo "$BODY" | jq -r '.file_name // empty' 2>/dev/null || true)
            if [ -n "$FNAME" ]; then
              echo "    OK: ${FNAME}"
            else
              echo "    FAIL (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
            fi
          fi

          echo "=== Gitee sync complete ==="
