name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            target: ''
            bundles: deb,rpm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Generate icons from source
        run: npx tauri icon src-tauri/icons/icon-source.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GClaw ${{ github.ref_name }}'
          releaseBody: '在下方 Assets 中下载对应平台的安装包。'
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} ${{ matrix.bundles != '' && format('--bundles {0}', matrix.bundles) || '' }}
          updaterJsonPreferNsis: true

  # 生成 server delta 文件并更新 latest.json
  generate-delta:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史和所有 tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bsdiff
        run: sudo apt-get install -y bsdiff

      - name: Generate server deltas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NEW_VERSION=$(jq -r '.serverVersion // .version' package.json)
          echo "=== Generating deltas for ${TAG} (server ${NEW_VERSION}) ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT

          # 1. 从当前 Release 的全量包中提取 server（而不是重新构建）
          echo "--- Extracting server from current release ---"
          gh release download "$TAG" --repo ggtiger/gclaw \
            --pattern "*.app.tar.gz" --dir "$TMPDIR/current" || true

          APP_TAR=$(ls "$TMPDIR/current"/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$APP_TAR" ]; then
            echo "No .app.tar.gz found in current release, skipping"
            exit 0
          fi

          mkdir -p "$TMPDIR/current-app"
          tar xzf "$APP_TAR" -C "$TMPDIR/current-app"
          SERVER_DIR=$(find "$TMPDIR/current-app" -path "*/Resources/server" -type d | head -1 || true)
          if [ -z "$SERVER_DIR" ]; then
            echo "Server directory not found in app bundle, skipping"
            exit 0
          fi

          tar czf "$TMPDIR/server-new.tar.gz" --exclude='.git' -C "$SERVER_DIR" .
          NEW_HASH=$(sha256sum "$TMPDIR/server-new.tar.gz" | cut -d' ' -f1)
          NEW_SIZE=$(stat -c%s "$TMPDIR/server-new.tar.gz")
          echo "New server tar: ${NEW_SIZE} bytes, sha256=${NEW_HASH}"

          # 2. 始终上传当前版本 server tar
          SERVER_TAR_NAME="server-${NEW_VERSION}.tar.gz"
          cp "$TMPDIR/server-new.tar.gz" "$TMPDIR/${SERVER_TAR_NAME}"
          echo "--- Uploading server tar for future deltas ---"
          gh release upload "$TAG" "$TMPDIR/${SERVER_TAR_NAME}" --repo ggtiger/gclaw --clobber

          # 3. 获取上一版本的 tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, skipping delta generation"
            exit 0
          fi
          OLD_VERSION=$(echo "$PREV_TAG" | sed 's/^v//')
          echo "Previous tag: ${PREV_TAG} (server ${OLD_VERSION})"

          # 4. 尝试获取上一版本的 server tar
          echo "--- Downloading previous server tar ---"
          PREV_SERVER_TAR="$TMPDIR/server-old.tar.gz"

          # 优先从 Release 下载上一版本的 server tar
          gh release download "$PREV_TAG" --repo ggtiger/gclaw \
            --pattern "server-${OLD_VERSION}.tar.gz" --dir "$TMPDIR" || true

          if [ -f "$TMPDIR/server-${OLD_VERSION}.tar.gz" ]; then
            cp "$TMPDIR/server-${OLD_VERSION}.tar.gz" "$PREV_SERVER_TAR"
          else
            # 回退：从上一版本的全量包中提取 server
            echo "No standalone server tar, extracting from app bundle..."
            gh release download "$PREV_TAG" --repo ggtiger/gclaw \
              --pattern "*.app.tar.gz" --dir "$TMPDIR" || true

            APP_TAR=$(ls "$TMPDIR"/*.app.tar.gz 2>/dev/null | head -1 || true)
            if [ -n "$APP_TAR" ]; then
              echo "Extracting server from ${APP_TAR}..."
              mkdir -p "$TMPDIR/old-app"
              tar xzf "$APP_TAR" -C "$TMPDIR/old-app"
              OLD_SERVER=$(find "$TMPDIR/old-app" -path "*/Resources/server" -type d | head -1 || true)
              if [ -n "$OLD_SERVER" ]; then
                tar czf "$PREV_SERVER_TAR" -C "$OLD_SERVER" .
              else
                echo "Server directory not found in old app bundle, skipping delta"
                exit 0
              fi
            else
              echo "No previous archive found, skipping delta generation"
              exit 0
            fi
          fi

          OLD_HASH=$(sha256sum "$PREV_SERVER_TAR" | cut -d' ' -f1)
          echo "Old server tar: sha256=${OLD_HASH}"

          # 5. 生成 bsdiff delta
          echo "--- Generating bsdiff delta ---"
          DELTA_NAME="server-delta-${OLD_VERSION}-${NEW_VERSION}.delta"
          DELTA_PATH="$TMPDIR/${DELTA_NAME}"
          bsdiff "$PREV_SERVER_TAR" "$TMPDIR/server-new.tar.gz" "$DELTA_PATH"

          DELTA_SIZE=$(stat -c%s "$DELTA_PATH")
          DELTA_HASH=$(sha256sum "$DELTA_PATH" | cut -d' ' -f1)
          echo "Delta: ${DELTA_NAME} (${DELTA_SIZE} bytes, sha256=${DELTA_HASH})"

          # 6. 上传 delta 到 Release
          echo "--- Uploading delta to release ---"
          gh release upload "$TAG" "$DELTA_PATH" --repo ggtiger/gclaw

          # 6. 更新 latest.json 注入 serverDeltas
          echo "--- Updating latest.json ---"
          gh release download "$TAG" --pattern "latest.json" --repo ggtiger/gclaw --clobber

          GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

          # 为各平台注入相同的 delta 信息
          jq --arg sv "$NEW_VERSION" \
             --arg from "$OLD_VERSION" \
             --arg url "${GH_BASE}/${DELTA_NAME}" \
             --argjson size "$DELTA_SIZE" \
             --arg hash "sha256:${DELTA_HASH}" \
             --arg targetHash "$DELTA_HASH" \
             '
             .serverVersion = $sv |
             .serverDeltas = {
               "darwin-aarch64": [{ from: $from, url: $url, size: $size, hash: $hash, targetHash: $targetHash }],
               "darwin-x86_64": [{ from: $from, url: $url, size: $size, hash: $hash, targetHash: $targetHash }],
               "windows-x86_64": [{ from: $from, url: $url, size: $size, hash: $hash, targetHash: $targetHash }],
               "linux-x86_64": [{ from: $from, url: $url, size: $size, hash: $hash, targetHash: $targetHash }]
             }
             ' latest.json > latest-updated.json

          mv latest-updated.json latest.json
          gh release upload "$TAG" latest.json --repo ggtiger/gclaw --clobber

          echo "=== Delta generation complete ==="

  release:
    needs: [build, generate-delta]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false

  # 同步 Release 到 Gitee（全部文件）
  sync-gitee:
    needs: [release, generate-delta]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'push'
    steps:
      - name: Sync release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: laohu2022
          GITEE_REPO: gclaw
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi

          TAG="${TAG}"
          echo "=== Syncing release ${TAG} to Gitee ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT
          cd "$TMPDIR"

          # 1. 从 GitHub 下载所有 release assets
          echo "--- Downloading all assets from GitHub ---"
          gh release download "$TAG" --repo ggtiger/gclaw --clobber

          TOTAL_SIZE=$(du -sh . | cut -f1)
          echo "Total: ${TOTAL_SIZE}"
          ls -lh

          # 2. 在 Gitee 创建 Release
          echo "--- Creating Gitee release ---"
          RELEASE_ID=$(curl -s --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release..."
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=GClaw ${TAG}" \
              -F "body=在下方 Assets 中下载对应平台的安装包。" \
              -F "target_commitish=main")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP ${HTTP_CODE}: ${BODY}" | head -c 500
            RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            echo "Release ID: ${RELEASE_ID}"
          else
            echo "Gitee release already exists: ${RELEASE_ID}"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create Gitee release"
            exit 1
          fi

          # 3. 上传所有文件到 Gitee（latest.json 最后单独处理）
          echo "--- Uploading to Gitee ---"
          SUCCESS=0
          FAIL=0
          for file in *; do
            [ -f "$file" ] || continue
            [ "$file" = "latest.json" ] && continue  # last.json 最后处理
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            echo "  Uploading: ${file} ($(( SIZE / 1024 )) KB)"
            RESP=$(curl -s --max-time 3600 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${file}")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            FNAME=$(echo "$BODY" | jq -r '(.file_name // .name) // empty' 2>/dev/null || true)
            if [ -n "$FNAME" ]; then
              echo "    OK: ${FNAME}"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "    FAIL (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Uploaded: ${SUCCESS} OK, ${FAIL} FAIL"

          # 4. 重写 latest.json URL（GitHub → Gitee）
          if [ -f "latest.json" ]; then
            echo "--- Rewriting latest.json for Gitee ---"
            GITEE_BASE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
            GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

            jq --arg gb "$GH_BASE" --arg gitee "$GITEE_BASE" '
              walk(
                if type == "object" and has("url") then
                  .url = (.url | sub($gb; $gitee))
                else .
                end
              )
            ' latest.json > latest-gitee.json

            echo "  Uploading: latest.json (rewritten)"
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@latest-gitee.json;filename=latest.json")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            FNAME=$(echo "$BODY" | jq -r '(.file_name // .name) // empty' 2>/dev/null || true)
            if [ -n "$FNAME" ]; then
              echo "    OK: ${FNAME}"
            else
              echo "    FAIL (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
            fi
          fi

          echo "=== Gitee sync complete ==="
