name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            target: ''
            bundles: deb,rpm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Generate icons from source
        run: npx tauri icon src-tauri/icons/icon-source.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GClaw ${{ github.ref_name }}'
          releaseBody: '在下方 Assets 中下载对应平台的安装包。'
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} ${{ matrix.bundles != '' && format('--bundles {0}', matrix.bundles) || '' }}
          updaterJsonPreferNsis: true

  # 生成 server delta 文件并更新 latest.json
  generate-delta:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史和所有 tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate server patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NEW_VERSION=$(jq -r '.version' package.json)
          echo "=== Generating file-level patches for ${TAG} (server ${NEW_VERSION}) ==="

          # 上传并回验函数：上传后从 GitHub 重新下载校验完整性
          upload_and_verify() {
            local file="$1"
            local tag="$2"
            local max_retries=3
            local attempt=1
            local basename=$(basename "$file")

            while [ $attempt -le $max_retries ]; do
              echo "Upload attempt $attempt/$max_retries: $basename"
              gh release upload "$tag" "$file" --repo ggtiger/gclaw --clobber

              # 回验：从 GitHub 重新下载并校验
              local verify_dir=$(mktemp -d)
              gh release download "$tag" --repo ggtiger/gclaw --pattern "$basename" --dir "$verify_dir"

              if [[ "$basename" == *.tar.gz ]]; then
                if gzip -t "$verify_dir/$basename" 2>/dev/null; then
                  echo "✓ Upload verified: $basename"
                  rm -rf "$verify_dir"
                  return 0
                else
                  echo "✗ Upload corrupted on attempt $attempt: $basename"
                fi
              elif [[ "$basename" == *.json ]]; then
                if jq empty "$verify_dir/$basename" 2>/dev/null; then
                  echo "✓ Upload verified: $basename"
                  rm -rf "$verify_dir"
                  return 0
                else
                  echo "✗ Upload corrupted on attempt $attempt: $basename"
                fi
              else
                echo "✓ Upload completed (no format check): $basename"
                rm -rf "$verify_dir"
                return 0
              fi

              rm -rf "$verify_dir"
              attempt=$((attempt + 1))
              sleep 5
            done

            echo "ERROR: Upload failed after $max_retries attempts: $basename"
            return 1
          }

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT

          # 1. 从当前 Release 的全量包中提取 server
          echo "--- Extracting server from current release ---"
          gh release download "$TAG" --repo ggtiger/gclaw \
            --pattern "*.app.tar.gz" --dir "$TMPDIR/current" || true

          APP_TAR=$(ls "$TMPDIR/current"/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$APP_TAR" ]; then
            echo "No .app.tar.gz found in current release, skipping"
            exit 0
          fi

          mkdir -p "$TMPDIR/current-app"
          tar xzf "$APP_TAR" -C "$TMPDIR/current-app"
          SERVER_DIR=$(find "$TMPDIR/current-app" -path "*/Resources/server" -type d | head -1 || true)
          if [ -z "$SERVER_DIR" ]; then
            echo "ERROR: Server directory not found in app bundle"
            exit 1
          fi

          NEW_SERVER_DIR="$SERVER_DIR"

          # 压缩版本用于下载
          gzip -c <(tar cf - -C "$SERVER_DIR" .) > "$TMPDIR/server-new.tar.gz"
          gzip -t "$TMPDIR/server-new.tar.gz" || { echo "ERROR: gzip verification failed!"; exit 1; }
          NEW_GZ_SIZE=$(stat -c%s "$TMPDIR/server-new.tar.gz")
          echo "New server tar.gz: ${NEW_GZ_SIZE} bytes"

          # 2. 始终上传当前版本 server tar
          SERVER_TAR_NAME="server-${NEW_VERSION}.tar.gz"
          cp "$TMPDIR/server-new.tar.gz" "$TMPDIR/${SERVER_TAR_NAME}"
          echo "--- Uploading server tar for future patches ---"
          upload_and_verify "$TMPDIR/${SERVER_TAR_NAME}" "$TAG"

          # 3. 获取最近 3 个旧版本 tag
          PREV_TAGS=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -3)
          if [ -z "$PREV_TAGS" ]; then
            echo "No previous tags found, skipping patch generation"
            exit 0
          fi
          echo "Previous tags to generate patches for: $(echo $PREV_TAGS | tr '\n' ' ')"

          # 4. 对每个旧版本循环生成文件级补丁
          DELTAS_JSON="[]"
          for PREV_TAG in $PREV_TAGS; do
            echo ""
            echo "--- Processing ${PREV_TAG} ---"

            # v* tag 需要从 Release 资产中查找实际 server 版本
            PROBE_DIR=$(mktemp -d)
            if gh release download "$PREV_TAG" --repo ggtiger/gclaw \
              --pattern "server-*.tar.gz" --dir "$PROBE_DIR" 2>/dev/null; then
              FOUND_TAR=$(ls -1 "$PROBE_DIR"/server-*.tar.gz 2>/dev/null | grep -v 'patch' | head -1)
              if [ -n "$FOUND_TAR" ]; then
                OLD_VERSION=$(basename "$FOUND_TAR" | sed 's/^server-//' | sed 's/\.tar\.gz$//')
              else
                echo "WARNING: No server tar in $PREV_TAG, skipping"
                rm -rf "$PROBE_DIR"
                continue
              fi
            else
              OLD_VERSION=$(echo "$PREV_TAG" | sed 's/^v//')
              echo "No server tar found for $PREV_TAG, falling back to tag-based version: $OLD_VERSION"
            fi
            rm -rf "$PROBE_DIR"

            echo "Resolved actual server version: ${OLD_VERSION}"

            OLD_WORKDIR="$TMPDIR/old-${OLD_VERSION}"
            mkdir -p "$OLD_WORKDIR"

            # 优先从 Release 下载旧版本的 server tar
            gh release download "$PREV_TAG" --repo ggtiger/gclaw \
              --pattern "server-${OLD_VERSION}.tar.gz" --dir "$OLD_WORKDIR" 2>/dev/null || true

            if [ ! -f "$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz" ]; then
              # 回退：从旧版本的全量包中提取 server
              echo "No standalone server tar for ${PREV_TAG}, extracting from app bundle..."
              gh release download "$PREV_TAG" --repo ggtiger/gclaw \
                --pattern "*.app.tar.gz" --dir "$OLD_WORKDIR" 2>/dev/null || true

              OLD_APP_TAR=$(ls "$OLD_WORKDIR"/*.app.tar.gz 2>/dev/null | head -1 || true)
              if [ -n "$OLD_APP_TAR" ]; then
                echo "Extracting server from ${OLD_APP_TAR}..."
                mkdir -p "$OLD_WORKDIR/app"
                tar xzf "$OLD_APP_TAR" -C "$OLD_WORKDIR/app"
                OLD_SERVER=$(find "$OLD_WORKDIR/app" -path "*/Resources/server" -type d | head -1 || true)
                if [ -n "$OLD_SERVER" ]; then
                  tar czf "$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz" -C "$OLD_SERVER" .
                else
                  echo "Server directory not found in ${PREV_TAG} app bundle, skipping this version"
                  continue
                fi
              else
                echo "No archive found for ${PREV_TAG}, skipping this version"
                continue
              fi
            fi

            OLD_TAR="$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz"
            if [ ! -f "$OLD_TAR" ]; then
              echo "Old server tar not found, skipping"
              continue
            fi

            # 解压旧版 server
            OLD_SERVER_DIR=$(mktemp -d)
            tar xzf "$OLD_TAR" -C "$OLD_SERVER_DIR"

            # 生成两边的文件列表和哈希
            PATCH_DIR=$(mktemp -d)

            (cd "$OLD_SERVER_DIR" && find . -type f | sort | while read f; do
              echo "$(sha256sum "$f" | cut -d' ' -f1) $f"
            done) > /tmp/old_hashes.txt

            (cd "$NEW_SERVER_DIR" && find . -type f | sort | while read f; do
              echo "$(sha256sum "$f" | cut -d' ' -f1) $f"
            done) > /tmp/new_hashes.txt

            # 分析差异
            ADDED=""
            MODIFIED=""
            DELETED=""

            while IFS=' ' read -r hash filepath; do
              filepath="${filepath#./}"
              old_hash=$(grep " \./${filepath}$" /tmp/old_hashes.txt | cut -d' ' -f1 || true)
              if [ -z "$old_hash" ]; then
                ADDED="${ADDED}\"${filepath}\","
                mkdir -p "$PATCH_DIR/$(dirname "$filepath")"
                cp "$NEW_SERVER_DIR/$filepath" "$PATCH_DIR/$filepath"
              elif [ "$hash" != "$old_hash" ]; then
                MODIFIED="${MODIFIED}\"${filepath}\","
                mkdir -p "$PATCH_DIR/$(dirname "$filepath")"
                cp "$NEW_SERVER_DIR/$filepath" "$PATCH_DIR/$filepath"
              fi
            done < /tmp/new_hashes.txt

            while IFS=' ' read -r hash filepath; do
              filepath="${filepath#./}"
              if ! grep -q " \./${filepath}$" /tmp/new_hashes.txt; then
                DELETED="${DELETED}\"${filepath}\","
              fi
            done < /tmp/old_hashes.txt

            ADDED=$(echo "[$ADDED]" | sed 's/,]/]/')
            MODIFIED=$(echo "[$MODIFIED]" | sed 's/,]/]/')
            DELETED=$(echo "[$DELETED]" | sed 's/,]/]/')

            jq -n \
              --arg from "$OLD_VERSION" \
              --arg to "$NEW_VERSION" \
              --argjson modified "$MODIFIED" \
              --argjson added "$ADDED" \
              --argjson deleted "$DELETED" \
              '{from: $from, to: $to, modified: $modified, added: $added, deleted: $deleted}' \
              > "$PATCH_DIR/__manifest.json"

            echo "=== Patch Manifest ==="
            cat "$PATCH_DIR/__manifest.json"

            TOTAL_CHANGES=$(echo "$ADDED $MODIFIED $DELETED" | tr ',' '\n' | grep -c '"' || true)

            if [ "$TOTAL_CHANGES" -gt 0 ]; then
              PATCH_NAME="server-patch-${OLD_VERSION}-${NEW_VERSION}.tar.gz"
              tar czf "$TMPDIR/${PATCH_NAME}" -C "$PATCH_DIR" .

              PATCH_SIZE=$(stat -c%s "$TMPDIR/${PATCH_NAME}")

              # 补丁大小异常检测：超过全量 tar.gz 的 80% 则跳过
              THRESHOLD=$(( NEW_GZ_SIZE * 80 / 100 ))
              if [ "$PATCH_SIZE" -gt "$THRESHOLD" ]; then
                echo "Patch ${PATCH_NAME} (${PATCH_SIZE} bytes) exceeds 80% of full tar (${NEW_GZ_SIZE} bytes), skipping"
                rm -f "$TMPDIR/${PATCH_NAME}"
                rm -rf "$OLD_SERVER_DIR" "$PATCH_DIR"
                continue
              fi

              PATCH_HASH=$(sha256sum "$TMPDIR/${PATCH_NAME}" | cut -d' ' -f1)
              echo "Patch: ${PATCH_NAME}, size: ${PATCH_SIZE}, hash: ${PATCH_HASH}"

              # 验证补丁完整性
              gzip -t "$TMPDIR/${PATCH_NAME}" || { echo "ERROR: $(basename $TMPDIR/${PATCH_NAME}) integrity check failed!"; exit 1; }

              # 上传 patch 到 Release
              echo "Uploading ${PATCH_NAME}..."
              upload_and_verify "$TMPDIR/${PATCH_NAME}" "$TAG"

              # 累积到 DELTAS_JSON 数组
              GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"
              DELTAS_JSON=$(echo "$DELTAS_JSON" | jq \
                --arg from "$OLD_VERSION" \
                --arg url "${GH_BASE}/${PATCH_NAME}" \
                --argjson size "$PATCH_SIZE" \
                --arg hash "sha256:${PATCH_HASH}" \
                '. + [{ from: $from, url: $url, size: $size, hash: $hash }]')
            else
              echo "No changes detected between ${OLD_VERSION} and ${NEW_VERSION}, skipping"
            fi

            rm -rf "$OLD_SERVER_DIR" "$PATCH_DIR"
          done

          # 5. 检查是否有有效的 patch
          PATCH_COUNT=$(echo "$DELTAS_JSON" | jq 'length')
          echo ""
          echo "--- Generated ${PATCH_COUNT} valid patch(es) ---"

          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "No valid patches generated, skipping latest.json update"
            exit 0
          fi

          # 6. 更新 latest.json 注入 serverDeltas 和 serverFullUrl
          echo "--- Updating latest.json ---"
          gh release download "$TAG" --pattern "latest.json" --repo ggtiger/gclaw --clobber

          # 计算 server 全量包的 hash 和 size，用于 serverFullUrl
          SERVER_FULL_SIZE=$(stat -c%s "$TMPDIR/${SERVER_TAR_NAME}" 2>/dev/null || stat -f%z "$TMPDIR/${SERVER_TAR_NAME}")
          SERVER_FULL_HASH=$(sha256sum "$TMPDIR/${SERVER_TAR_NAME}" | cut -d' ' -f1)
          GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"
          SERVER_FULL_GH_URL="${GH_BASE}/${SERVER_TAR_NAME}"
          SERVER_FULL_CDN_URL="https://${{ secrets.QINIU_CDN_DOMAIN }}/gclaw/releases/${TAG}/${SERVER_TAR_NAME}"
          echo "Server full tar: size=${SERVER_FULL_SIZE}, hash=${SERVER_FULL_HASH}"

          jq --arg sv "$NEW_VERSION" \
             --argjson deltas "$DELTAS_JSON" \
             --arg sfu_url "$SERVER_FULL_GH_URL" \
             --arg sfu_cdn "$SERVER_FULL_CDN_URL" \
             --argjson sfu_size "$SERVER_FULL_SIZE" \
             --arg sfu_hash "sha256:${SERVER_FULL_HASH}" \
             '
             .version = $sv |
             .serverVersion = $sv |
             .serverFullUrl = {
               url: $sfu_url,
               cdnUrl: $sfu_cdn,
               size: $sfu_size,
               hash: $sfu_hash
             } |
             .serverDeltas = {
               "darwin-aarch64": $deltas,
               "darwin-x86_64": $deltas,
               "windows-x86_64": $deltas,
               "linux-x86_64": $deltas
             }
             ' latest.json > latest-updated.json

          mv latest-updated.json latest.json
          upload_and_verify latest.json "$TAG"

          echo "=== Patch generation complete ==="

  release:
    needs: [build, generate-delta]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 生成自上个 tag 以来的 commit log 作为 release notes
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(cat <<EOF
          ## GClaw ${VERSION}

          ### 变更内容
          $(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s" --no-merges)

          ---
          在下方 Assets 中下载对应平台的安装包。
          EOF
          )
          else
            NOTES=$(cat <<EOF
          ## GClaw ${VERSION}

          ### 变更内容
          $(git log --pretty=format:"- %s" --no-merges -20)

          ---
          在下方 Assets 中下载对应平台的安装包。
          EOF
          )
          fi

          gh release edit "$TAG" --notes "$NOTES" --draft=false

  # 同步 Release 到 Gitee（全部文件）
  sync-gitee:
    needs: [release, generate-delta]
    runs-on: ubuntu-latest
    timeout-minutes: 1200
    if: github.event_name == 'push'
    steps:
      - name: Sync release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: laohu2022
          GITEE_REPO: gclaw
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi

          TAG="${TAG}"
          echo "=== Syncing release ${TAG} to Gitee ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT
          cd "$TMPDIR"

          # 1. 从 GitHub 下载所有 release assets
          echo "--- Downloading all assets from GitHub ---"
          gh release download "$TAG" --repo ggtiger/gclaw --clobber

          TOTAL_SIZE=$(du -sh . | cut -f1)
          echo "Total: ${TOTAL_SIZE}"
          ls -lh

          # 2. 在 Gitee 创建 Release
          echo "--- Creating Gitee release ---"
          RELEASE_ID=$(curl -s --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release..."
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=GClaw ${TAG}" \
              -F "body=在下方 Assets 中下载对应平台的安装包。" \
              -F "target_commitish=main")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP ${HTTP_CODE}: ${BODY}" | head -c 500
            RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            echo "Release ID: ${RELEASE_ID}"
          else
            echo "Gitee release already exists: ${RELEASE_ID}"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create Gitee release"
            exit 1
          fi

          # 删除 Gitee Release 中同名旧资产（Gitee 不支持覆盖，必须先删再传）
          delete_gitee_asset() {
            local filename="$1"
            ASSETS=$(curl -s --max-time 30 \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}" \
              | jq -r ".assets // [] | .[] | select(.name == \"${filename}\") | .id" 2>/dev/null || true)
            for AID in $ASSETS; do
              echo "  Deleting old asset: ${filename} (id=${AID})"
              curl -s --max-time 30 -X DELETE \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files/${AID}?access_token=${GITEE_TOKEN}" >/dev/null 2>&1 || true
            done
          }

          # Gitee 上传函数（先删旧文件再上传，带重试）
          upload_to_gitee() {
            local file=$1 max_time=$2 retries=3 delay=10
            local FNAME=$(basename "$file")
            local SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            delete_gitee_asset "$FNAME"
            echo "  Uploading: ${FNAME} ($(( SIZE / 1024 )) KB)"
            for i in $(seq 1 $retries); do
              RESP=$(curl -s --max-time "$max_time" --connect-timeout 30 --retry 2 --retry-delay 5 \
                -w "\n%{http_code}" -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" 2>&1)
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | sed '$d')
              RESULT_NAME=$(echo "$BODY" | jq -r '(.file_name // .name) // empty' 2>/dev/null || true)
              if [ -n "$RESULT_NAME" ]; then
                echo "    OK: ${RESULT_NAME}"
                return 0
              fi
              echo "    Attempt ${i}/${retries} failed (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
              [ $i -lt $retries ] && sleep $delay
            done
            echo "    FAIL: ${FNAME}"
            return 1
          }

          # 3. 上传文件到 Gitee（分两步：先小文件，再大文件）
          echo "--- Step 1: Uploading critical small files ---"
          SUCCESS=0
          FAIL=0

          # 3a. 优先上传 patch（小文件，更新必需）
          for file in server-patch-*.tar.gz; do
            [ -f "$file" ] || continue
            if upload_to_gitee "$file" 300; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done

          # 3b. 上传 latest.json（URL 重写为 Gitee）
          if [ -f "latest.json" ]; then
            echo "--- Rewriting latest.json for Gitee ---"
            GITEE_BASE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
            GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

            jq --arg gb "$GH_BASE" --arg gitee "$GITEE_BASE" '
              walk(
                if type == "object" and has("url") then
                  .url = (.url | sub($gb; $gitee))
                else .
                end
              )
            ' latest.json > latest-gitee.json

            if upload_to_gitee "latest-gitee.json" 60; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          fi

          echo "Step 1 done: ${SUCCESS} OK, ${FAIL} FAIL"

          # 3c. 上传剩余大文件（安装包）
          echo "--- Step 2: Uploading large installers ---"
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              server-patch-*.tar.gz|latest.json|latest-gitee.json) continue ;;
            esac
            if upload_to_gitee "$file" 3600; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Total: ${SUCCESS} OK, ${FAIL} FAIL"

          echo "=== Gitee sync complete ==="

  # 同步 Release 到七牛云 CDN（加速国内下载）
  sync-qiniu:
    needs: [release, generate-delta]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Download assets from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p assets
          cd assets
          echo "--- Downloading all assets from GitHub Release ${TAG} ---"
          gh release download "$TAG" --repo ggtiger/gclaw --clobber
          echo "--- Downloaded files ---"
          ls -lh

      - name: Install qshell
        run: |
          set -e
          echo "--- Installing qshell ---"
          curl -fSL -o qshell.tar.gz https://github.com/qiniu/qshell/releases/download/v2.19.4/qshell-v2.19.4-linux-amd64.tar.gz
          tar xzf qshell.tar.gz
          chmod +x qshell
          sudo mv qshell /usr/local/bin/qshell
          qshell version

      - name: Configure qshell
        run: |
          qshell account ${{ secrets.QINIU_ACCESS_KEY }} ${{ secrets.QINIU_SECRET_KEY }} gclaw-ci

      - name: Rewrite latest.json URLs for Qiniu
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          CDN_BASE="https://o09u11p5v.qnssl.com/gclaw/releases/${VERSION}"
          GH_BASE="https://github.com/ggtiger/gclaw/releases/download/${TAG}"

          if [ ! -f assets/latest.json ]; then
            echo "WARNING: latest.json not found, skipping URL rewrite"
            exit 0
          fi

          echo "--- Rewriting latest.json URLs ---"
          echo "GitHub base: ${GH_BASE}"
          echo "CDN base:    ${CDN_BASE}"

          jq --arg gb "$GH_BASE" --arg cdn "$CDN_BASE" '
            walk(
              if type == "object" and has("url") then
                .url = (.url | sub($gb; $cdn))
              else .
              end
            ) |
            walk(
              if type == "object" and has("signature") then
                .signature = (.signature | sub($gb; $cdn))
              else .
              end
            )
          ' assets/latest.json > assets/latest-qiniu.json

          mv assets/latest-qiniu.json assets/latest.json
          echo "--- Rewritten latest.json ---"
          cat assets/latest.json | jq .

      - name: Upload all files to Qiniu
        env:
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          FAIL=0
          SUCCESS=0

          upload_with_retry() {
            local local_file="$1"
            local key="$2"
            local retries=3
            local attempt=1
            while [ $attempt -le $retries ]; do
              echo "  Upload attempt ${attempt}/${retries}: ${key}"
              if qshell fput "${QINIU_BUCKET}" "${key}" "${local_file}" --overwrite; then
                echo "  OK: ${key}"
                return 0
              fi
              echo "  Attempt ${attempt} failed"
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "  FAIL: ${key}"
            return 1
          }

          echo "--- Uploading assets to Qiniu (gclaw/releases/${VERSION}/) ---"
          cd assets
          for file in *; do
            [ -f "$file" ] || continue
            KEY="gclaw/releases/${VERSION}/${file}"
            if upload_with_retry "$file" "$KEY"; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done

          # 额外上传 latest.json 到固定路径（客户端检查更新用）
          if [ -f "latest.json" ]; then
            echo "--- Uploading latest.json to gclaw/latest.json ---"
            if upload_with_retry "latest.json" "gclaw/latest.json"; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          fi

          cd ..
          echo "=== Qiniu upload complete: ${SUCCESS} OK, ${FAIL} FAIL ==="
          if [ $FAIL -gt 0 ]; then
            echo "WARNING: ${FAIL} file(s) failed to upload to Qiniu"
          fi

      - name: Refresh Qiniu CDN cache
        if: success()
        run: |
          echo "=== Refreshing CDN cache for latest.json ==="
          echo "https://o09u11p5v.qnssl.com/gclaw/latest.json" > /tmp/cdn_refresh_urls.txt
          qshell cdnrefresh --urls -i /tmp/cdn_refresh_urls.txt || echo "WARNING: CDN refresh failed, cache will expire naturally"
          echo "CDN cache refresh requested"
