name: Server Release

# Server-only 独立发布工作流
# 只构建 Next.js server bundle，不编译 Rust/Tauri
# 适用于仅修改了 server 端代码的快速发布

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: 构建 server bundle 并生成 delta
  build-and-delta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史和所有 tag，用于查找旧版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bsdiff
        run: sudo apt-get update && sudo apt-get install -y bsdiff

      # 从 tag 名中提取版本号（server-v0.2.8 -> 0.2.8）
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#server-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Server version: ${VERSION}"

      # 更新 package.json 版本号以匹配 tag
      - name: Update package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Updated package.json version to ${VERSION}"

      # 构建 Next.js standalone 产物
      - name: Build Next.js
        run: npm run build

      # 使用 standalone-utils.js 的逻辑组装 server bundle
      - name: Assemble server bundle
        run: |
          node -e '
            const path = require("path");
            const fs = require("fs");
            const { assembleServerBundle, printBundleSize } = require("./scripts/standalone-utils");

            const ROOT = process.cwd();
            const STANDALONE_DIR = path.join(ROOT, ".next", "standalone");

            if (!fs.existsSync(STANDALONE_DIR)) {
              console.error("ERROR: .next/standalone not found");
              process.exit(1);
            }

            function findFile(dir, filename, maxDepth) {
              if (maxDepth === undefined) maxDepth = 10;
              if (maxDepth <= 0 || !fs.existsSync(dir)) return null;
              try {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  if (entry.isDirectory()) {
                    if (entry.name === "node_modules") continue;
                    const result = findFile(path.join(dir, entry.name), filename, maxDepth - 1);
                    if (result) return result;
                  } else if (entry.name === filename) {
                    return path.join(dir, entry.name);
                  }
                }
              } catch(e) {}
              return null;
            }

            const serverJs = findFile(STANDALONE_DIR, "server.js");
            if (!serverJs) {
              console.error("ERROR: server.js not found in standalone output");
              process.exit(1);
            }

            const standaloneRoot = path.dirname(serverJs);
            console.log("Standalone root:", standaloneRoot);

            const destDir = path.join(ROOT, "dist", "gclaw-server");
            assembleServerBundle(standaloneRoot, destDir);
            printBundleSize(destDir);
          '

      # 打包为 tar.gz（使用确定性参数保证可复现的 tar）
      - name: Package server bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SERVER_TAR_NAME="server-${VERSION}.tar.gz"

          # 创建确定性的 tar（bsdiff 工作在未压缩的 tar 上）
          tar cf dist/server-current.tar \
            --exclude='.git' \
            --sort=name \
            --mtime='2024-01-01 00:00:00' \
            --owner=0 --group=0 --numeric-owner \
            -C dist/gclaw-server .

          # 压缩版本用于分发
          gzip -k dist/server-current.tar
          cp dist/server-current.tar.gz "dist/${SERVER_TAR_NAME}"

          # 计算 hash
          NEW_HASH=$(sha256sum dist/server-current.tar | cut -d' ' -f1)
          NEW_GZ_SIZE=$(stat -c%s "dist/${SERVER_TAR_NAME}")
          echo "Server tar: ${SERVER_TAR_NAME} (${NEW_GZ_SIZE} bytes)"
          echo "SHA-256 (uncompressed tar): ${NEW_HASH}"

          echo "NEW_HASH=${NEW_HASH}" >> "$GITHUB_ENV"
          echo "NEW_GZ_SIZE=${NEW_GZ_SIZE}" >> "$GITHUB_ENV"
          echo "SERVER_TAR_NAME=${SERVER_TAR_NAME}" >> "$GITHUB_ENV"

      # 从之前的 Release（v* 和 server-v*）中下载旧版本 server tar，生成 bsdiff delta
      - name: Generate bsdiff deltas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          echo "=== Generating deltas for ${TAG} (server ${VERSION}) ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT

          # 查找最近 3 个包含 server tar 的旧版本（从 v* 和 server-v* tag 中查找）
          # 合并两种 tag 并按创建时间排序
          ALL_TAGS=$(git tag --sort=-creatordate | grep -E '^(v|server-v)[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -10)

          if [ -z "$ALL_TAGS" ]; then
            echo "No previous tags found, skipping delta generation"
            mkdir -p dist
            echo "[]" > dist/deltas.json
            exit 0
          fi

          echo "Candidate tags: $(echo $ALL_TAGS | tr '\n' ' ')"

          DELTAS_JSON="[]"
          DELTA_COUNT=0

          for PREV_TAG in $ALL_TAGS; do
            [ "$DELTA_COUNT" -ge 3 ] && break

            # 从 tag 名提取版本号
            OLD_VERSION=$(echo "$PREV_TAG" | sed 's/^server-v//' | sed 's/^v//')
            echo ""
            echo "--- Trying ${PREV_TAG} (server ${OLD_VERSION}) ---"

            OLD_WORKDIR="$TMPDIR/old-${OLD_VERSION}"
            mkdir -p "$OLD_WORKDIR"
            PREV_SERVER_TAR="$OLD_WORKDIR/server-old.tar"

            # 优先下载独立的 server tar
            gh release download "$PREV_TAG" --repo "${{ github.repository }}" \
              --pattern "server-${OLD_VERSION}.tar.gz" --dir "$OLD_WORKDIR" 2>/dev/null || true

            if [ -f "$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz" ]; then
              gunzip -k "$OLD_WORKDIR/server-${OLD_VERSION}.tar.gz"
              mv "$OLD_WORKDIR/server-${OLD_VERSION}.tar" "$PREV_SERVER_TAR"
            else
              # 回退：从全量 Tauri Release 的 app bundle 中提取
              echo "No standalone server tar for ${PREV_TAG}, trying app bundle..."
              gh release download "$PREV_TAG" --repo "${{ github.repository }}" \
                --pattern "*.app.tar.gz" --dir "$OLD_WORKDIR" 2>/dev/null || true

              OLD_APP_TAR=$(ls "$OLD_WORKDIR"/*.app.tar.gz 2>/dev/null | head -1 || true)
              if [ -n "$OLD_APP_TAR" ]; then
                echo "Extracting server from ${OLD_APP_TAR}..."
                mkdir -p "$OLD_WORKDIR/app"
                tar xzf "$OLD_APP_TAR" -C "$OLD_WORKDIR/app"
                OLD_SERVER=$(find "$OLD_WORKDIR/app" -path "*/Resources/server" -type d | head -1 || true)
                if [ -n "$OLD_SERVER" ]; then
                  tar cf "$PREV_SERVER_TAR" --exclude='.git' --sort=name \
                    --mtime='2024-01-01 00:00:00' --owner=0 --group=0 --numeric-owner \
                    -C "$OLD_SERVER" .
                else
                  echo "Server directory not found in ${PREV_TAG} app bundle, skipping"
                  continue
                fi
              else
                echo "No archive found for ${PREV_TAG}, skipping"
                continue
              fi
            fi

            # 生成 bsdiff delta（在未压缩的 tar 上差分，避免 gzip 放大差异）
            echo "Generating bsdiff: ${OLD_VERSION} -> ${VERSION}..."
            DELTA_NAME="server-delta-${OLD_VERSION}-${VERSION}.delta"
            DELTA_RAW="$OLD_WORKDIR/${DELTA_NAME}.raw"
            DELTA_PATH="$TMPDIR/${DELTA_NAME}"

            bsdiff "$PREV_SERVER_TAR" dist/server-current.tar "$DELTA_RAW"
            gzip -c "$DELTA_RAW" > "$DELTA_PATH"
            rm "$DELTA_RAW"

            DELTA_SIZE=$(stat -c%s "$DELTA_PATH")

            # Delta 大小异常检测：超过全量 tar.gz 的 80% 则跳过（delta 没有意义）
            THRESHOLD=$(( ${NEW_GZ_SIZE} * 80 / 100 ))
            if [ "$DELTA_SIZE" -gt "$THRESHOLD" ]; then
              echo "Delta ${DELTA_NAME} (${DELTA_SIZE} bytes) exceeds 80% of full tar (${NEW_GZ_SIZE} bytes), skipping"
              rm -f "$DELTA_PATH"
              continue
            fi

            DELTA_HASH=$(sha256sum "$DELTA_PATH" | cut -d' ' -f1)
            echo "Delta: ${DELTA_NAME} (${DELTA_SIZE} bytes, sha256=${DELTA_HASH})"

            # 复制 delta 到 dist 目录供后续上传
            cp "$DELTA_PATH" "dist/${DELTA_NAME}"

            # 累积到 JSON 数组
            GH_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
            DELTAS_JSON=$(echo "$DELTAS_JSON" | jq \
              --arg from "$OLD_VERSION" \
              --arg url "${GH_BASE}/${DELTA_NAME}" \
              --argjson size "$DELTA_SIZE" \
              --arg hash "sha256:${DELTA_HASH}" \
              --arg targetHash "${NEW_HASH}" \
              '. + [{ from: $from, url: $url, size: $size, hash: $hash, targetHash: $targetHash }]')

            DELTA_COUNT=$((DELTA_COUNT + 1))
          done

          echo ""
          echo "--- Generated ${DELTA_COUNT} valid delta(s) ---"

          # 保存 deltas JSON 到文件（避免环境变量中的转义问题）
          echo "$DELTAS_JSON" > dist/deltas.json
          echo "delta_count=${DELTA_COUNT}" >> "$GITHUB_ENV"

      # 生成 latest.json（保留现有 Tauri 更新信息，更新 server 相关字段）
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          DELTAS_JSON=$(cat dist/deltas.json)

          # 尝试从最近的全量 Release (v* tag) 下载现有 latest.json 以保留 platforms 字段
          LATEST_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          EXISTING_LATEST=""

          if [ -n "$LATEST_TAG" ]; then
            echo "Trying to download latest.json from ${LATEST_TAG}..."
            gh release download "$LATEST_TAG" --repo "${{ github.repository }}" \
              --pattern "latest.json" --dir dist/existing 2>/dev/null || true
            if [ -f "dist/existing/latest.json" ]; then
              EXISTING_LATEST="dist/existing/latest.json"
              echo "Found existing latest.json from ${LATEST_TAG}"
            fi
          fi

          # 也尝试从最近的 server-v* Release 获取
          if [ -z "$EXISTING_LATEST" ]; then
            LATEST_SERVER_TAG=$(git tag --sort=-creatordate | grep -E '^server-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1 || true)
            if [ -n "$LATEST_SERVER_TAG" ]; then
              echo "Trying to download latest.json from ${LATEST_SERVER_TAG}..."
              mkdir -p dist/existing
              gh release download "$LATEST_SERVER_TAG" --repo "${{ github.repository }}" \
                --pattern "latest.json" --dir dist/existing 2>/dev/null || true
              if [ -f "dist/existing/latest.json" ]; then
                EXISTING_LATEST="dist/existing/latest.json"
                echo "Found existing latest.json from ${LATEST_SERVER_TAG}"
              fi
            fi
          fi

          if [ -n "$EXISTING_LATEST" ]; then
            # 在现有 latest.json 基础上更新 server 相关字段（保留 platforms 等 Tauri 更新信息）
            jq --arg sv "$VERSION" \
               --argjson deltas "$DELTAS_JSON" \
               '
               .version = $sv |
               .serverVersion = $sv |
               .serverDeltas = {
                 "darwin-aarch64": $deltas,
                 "darwin-x86_64": $deltas,
                 "windows-x86_64": $deltas,
                 "linux-x86_64": $deltas
               }
               ' "$EXISTING_LATEST" > dist/latest.json
          else
            # 没有现有 latest.json，创建一个仅包含 server 信息的新文件
            echo "No existing latest.json found, creating new one"
            jq -n \
               --arg sv "$VERSION" \
               --argjson deltas "$DELTAS_JSON" \
               '{
                 version: $sv,
                 serverVersion: $sv,
                 serverDeltas: {
                   "darwin-aarch64": $deltas,
                   "darwin-x86_64": $deltas,
                   "windows-x86_64": $deltas,
                   "linux-x86_64": $deltas
                 }
               }' > dist/latest.json
          fi

          echo "=== latest.json content ==="
          cat dist/latest.json | jq .
          echo "=========================="

      # 创建 GitHub Release 并上传所有资产
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # 创建 Release（如果不存在）
          NOTES="Server-only 更新 (v${VERSION})。仅包含 Next.js server 变更，无需重新下载完整客户端。"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "GClaw Server ${VERSION}" \
            --notes "$NOTES" \
            --latest=false \
            2>/dev/null || echo "Release already exists, uploading assets..."

          # 上传 server tar
          echo "--- Uploading server tar ---"
          gh release upload "$TAG" "dist/${SERVER_TAR_NAME}" \
            --repo "${{ github.repository }}" --clobber

          # 上传 delta 文件
          echo "--- Uploading delta files ---"
          for delta in dist/server-delta-*.delta; do
            [ -f "$delta" ] || continue
            echo "  Uploading: $(basename $delta)"
            gh release upload "$TAG" "$delta" \
              --repo "${{ github.repository }}" --clobber
          done

          # 上传 latest.json
          echo "--- Uploading latest.json ---"
          gh release upload "$TAG" dist/latest.json \
            --repo "${{ github.repository }}" --clobber

          echo "=== GitHub Release complete ==="

  # Job 2: 同步 Release 到 Gitee
  sync-gitee:
    needs: build-and-delta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release to Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: laohu2022
          GITEE_REPO: gclaw
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi

          TAG="${TAG}"
          echo "=== Syncing server release ${TAG} to Gitee ==="

          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT
          cd "$TMPDIR"

          # 1. 从 GitHub 下载当前 Release 的所有资产
          echo "--- Downloading assets from GitHub ---"
          gh release download "$TAG" --repo "${{ github.repository }}" --clobber

          ls -lh
          echo ""

          # 2. 在 Gitee 创建 Release
          echo "--- Creating Gitee release ---"
          RELEASE_ID=$(curl -s --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release on Gitee..."
            RESP=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=GClaw Server ${TAG#server-v}" \
              -F "body=Server-only 更新。仅包含 Next.js server 变更。" \
              -F "target_commitish=main")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP ${HTTP_CODE}: $(echo "$BODY" | head -c 500)"
            RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
          else
            echo "Gitee release already exists: ${RELEASE_ID}"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create Gitee release"
            exit 1
          fi

          # Gitee 上传函数（带重试）
          upload_to_gitee() {
            local file=$1 max_time=$2 retries=3 delay=10
            local SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            echo "  Uploading: ${file} ($(( SIZE / 1024 )) KB)"
            for i in $(seq 1 $retries); do
              RESP=$(curl -s --max-time "$max_time" --connect-timeout 30 --retry 2 --retry-delay 5 \
                -w "\n%{http_code}" -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" 2>&1)
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | sed '$d')
              FNAME=$(echo "$BODY" | jq -r '(.file_name // .name) // empty' 2>/dev/null || true)
              if [ -n "$FNAME" ]; then
                echo "    OK: ${FNAME}"
                return 0
              fi
              echo "    Attempt ${i}/${retries} failed (HTTP ${HTTP_CODE}): $(echo "$BODY" | head -c 200)"
              [ $i -lt $retries ] && sleep $delay
            done
            echo "    FAIL: ${file}"
            return 1
          }

          # 3. 上传文件
          echo "--- Uploading files to Gitee ---"
          SUCCESS=0
          FAIL=0

          # 3a. 上传 delta 文件（小文件，优先）
          for file in server-delta-*.delta; do
            [ -f "$file" ] || continue
            if upload_to_gitee "$file" 300; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done

          # 3b. 上传 latest.json（URL 重写为 Gitee 地址）
          if [ -f "latest.json" ]; then
            echo "--- Rewriting latest.json URLs for Gitee ---"
            GITEE_BASE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
            GH_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

            jq --arg gb "$GH_BASE" --arg gitee "$GITEE_BASE" '
              walk(
                if type == "object" and has("url") then
                  .url = (.url | sub($gb; $gitee))
                else .
                end
              )
            ' latest.json > latest-gitee.json

            if upload_to_gitee "latest-gitee.json" 60; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          fi

          # 3c. 上传 server tar（较大文件）
          for file in server-*.tar.gz; do
            [ -f "$file" ] || continue
            if upload_to_gitee "$file" 600; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "=== Gitee sync complete: ${SUCCESS} OK, ${FAIL} FAIL ==="
